apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: memory-api }
  template:
    metadata:
      labels: { app: memory-api }
    spec:
      containers:
        - name: memory-api
          image: agent-memory/memory-api:latest
          ports:
            - containerPort: 8080
